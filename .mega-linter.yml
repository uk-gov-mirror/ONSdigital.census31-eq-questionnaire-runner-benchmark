---
# Configuration file for MegaLinter
#
# See all available variables at https://megalinter.io/latest/config-file/ and in
# linters documentation
# all, none, or list of linter keys

# If you use ENABLE variable, all other languages/formats/tooling-formats will
# be disabled by default
# Have decided not to enable the Python linter as has been recommended in point 7
# in the [python template readme](https://github.com/ONSdigital/ons-python-template#3-megalinter)
ENABLE:
  - ACTION
  - BASH
  - DOCKERFILE
  - EDITORCONFIG
  - JSON
  - MARKDOWN
  - REPOSITORY
  - YAML

FORMATTERS_DISABLE_ERRORS: false
SHOW_ELAPSED_TIME: true
FLAVOR_SUGGESTIONS: false

DISABLE_LINTERS:
  - REPOSITORY_GITLEAKS # Superseded by betterleaks (deprecated in MegaLinter v10)
  - REPOSITORY_TRUFFLEHOG # Secret scanning covered by betterleaks and secretlint
  - REPOSITORY_KINGFISHER # Only produced false positives on benchmark CSV data; overlaps with betterleaks/secretlint
  - REPOSITORY_GRYPE # 52s; vulnerability scanning covered by trivy and osv-scanner
  - REPOSITORY_TRIVY_SBOM # Redundant with syft

ACTION_ZIZMOR_UNSECURED_ENV_VARIABLES:
  - GITHUB_TOKEN

REPOSITORY_SECRETLINT_FILTER_REGEX_EXCLUDE: "(jwt-test-keys/)"
REPOSITORY_SECRETLINT_ARGUMENTS: "--secretlintignore .secretlintignore"
